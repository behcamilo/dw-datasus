# PostgreSQL 17 do DW. Subir: docker compose up -d   |   Derrubar (mantendo dados): docker compose down
# Os schemas (um por camada) são criados por docker/init/01_schemas.sql na primeira subida.
services:
  dw:
    image: postgres:17.11   # versão fixa: a mesma em qualquer máquina
    container_name: dw_datasus
    environment:
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: dw_local   # banco local
      POSTGRES_DB: dw
    ports:
      - "5433:5432"                 # 5433 no host para não colidir com um Postgres local
    volumes:
      - dw_dados:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    # Para 16 núcleos e 32 GB de RAM; numa máquina menor, reduza a memória.
    # Fica igual em todas as cargas, para os tempos serem comparáveis.
    command:
      - postgres
      - -c
      - shared_buffers=8GB
      - -c
      - effective_cache_size=20GB
      - -c
      - work_mem=128MB              # vale para cada ordenação ou hash: uma consulta pode usar várias vezes
      - -c
      - maintenance_work_mem=1GB    # criação de índices
      - -c
      - max_wal_size=32GB           # menos checkpoints no meio das cargas grandes
      - -c
      - checkpoint_timeout=30min
      - -c
      - wal_level=minimal           # sem réplica: CREATE TABLE AS e COPY em tabela nova não gravam WAL
      - -c
      - max_wal_senders=0
      - -c
      - synchronous_commit=off      # se a máquina cair, perde só os últimos commits, sem corromper o banco
    shm_size: 4gb                   # consultas paralelas trocam dados por memória compartilhada
volumes:
  dw_dados:
